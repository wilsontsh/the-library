      if (changed) await this.push(true);
      return true;
    } catch (e) {
      this.status = 'error'; this.error = String(e.message) === 'auth' ? 'GitHub refused the key. Check that it can read and write the data repository.' : 'Couldn’t reach GitHub. Your changes are kept on this device.';
      renderSync(); return false;
    }
  },
  async push(force, keepalive) {
    if (!this.connected()) { this.status = 'local'; renderSync(); return; }
    if (this.pushing) { this.again = true; return; }
    this.pushing = true; this.status = 'syncing'; renderSync();
    try {
      const body = { message: 'Update library ' + new Date().toISOString(), content: b64e(JSON.stringify(this.data)) };
      if (this.sha) body.sha = this.sha;
      const r = await this.api('PUT', body, false, null, keepalive);
      if (r.status === 409 || r.status === 422) { this.pushing = false; return this.pull(); }
      if (r.status === 401 || r.status === 403) throw new Error('auth');
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json(); this.sha = j.content.sha; LS.set('library.sha', this.sha);
      this.status = 'synced'; this.error = ''; this.savedAt = Date.now();
    } catch (e) {
      this.status = 'error'; this.error = String(e.message) === 'auth' ? 'GitHub refused the key. Check that it can read and write the data repository.' : 'Couldn’t reach GitHub. Your changes are kept on this device and will sync later.';
    }
    this.pushing = false; renderSync();
    if (this.again) { this.again = false; this.push(); }
  },
  /* small binary files (cover photos) next to library.json */
  async putFile(path, base64) {
    if (!this.connected()) return false;
    try {
      let sha;
      const h = await this.api('GET', null, false, path); if (h.ok) sha = (await h.json()).sha;
      const r = await this.api('PUT', Object.assign({ message: 'Cover ' + path, content: base64 }, sha ? { sha } : {}), false, path);
      return r.ok;
    } catch (e) { return false; }
  },
  async getFile(path) {
    if (!this.connected()) return null;
    try { const r = await this.api('GET', null, true, path); return r.ok ? await r.blob() : null; } catch (e) { return null; }
  }
};

/* ---------------- one place every change goes through ---------------- */
function onData() { // after a pull or restore
  S.books = Object.values(Store.data.books);
  S.settings = Store.data.settings;
  S.ready = true;
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && (S.view === 'book' || S.sheet)) return; // don't yank the field she is typing in
  if (drag) return;
  render();
}
function adoptPatch(b, patch) {
  if (b && b.sample && Object.keys(patch).some((k) => !QUIET_KEYS.has(k))) { patch.sample = false; patch.wasSample = true; }
  return patch;
}
function saveBook(id, patch, quiet) { // instant, field-stamped; label only is debounced
  const b = S.books.find((x) => x.id === id) || Store.data.books[id];
  Store.patch(id, quiet ? patch : adoptPatch(b, patch));
  flashSaved();
  return true;
}
function addBook(doc) { const id = doc.id || uid(); const b = Store.setBook(id, doc); S.books = Object.values(Store.data.books); return b; }
function removeBook(id) {
  const old = Store.data.books[id] && JSON.parse(JSON.stringify(Store.data.books[id]));
  Store.del(id); S.books = Object.values(Store.data.books);
  return old;
}
function restoreBook(doc) { Store.putRaw(doc.id, doc); Store.data.books[doc.id].updatedAt = Date.now(); Store.touch(); S.books = Object.values(Store.data.books); }
function saveSettings(p) { Store.settings(p); S.settings = Store.data.settings; }
let savedT = null;
function flashSaved() {
  const el = document.getElementById('saved'); if (!el) return;
  el.textContent = 'Saving…'; clearTimeout(savedT);
  savedT = setTimeout(() => { const e2 = document.getElementById('saved'); if (e2) e2.textContent = S.storageError ? 'Not saved on this device' : 'Saved'; }, 500);
}

/* ---------------- undo ---------------- */
function undoable(text, revert) { toast(text, { label: 'Undo', fn: () => { revert(); render(); toast('Undone'); } }, 8000); }

/* ---------------- cover photos: kept in IndexedDB, copied to the private repo ---------------- */
const Covers = {
  db: null, urls: new Map(),
  open() {
    if (this.db) return this.db;
    this.db = new Promise((res, rej) => { try { const r = indexedDB.open('library-covers', 1); r.onupgradeneeded = () => r.result.createObjectStore('c'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
    return this.db;
  },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('c', mode); const st = t.objectStore('c'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); },
  async put(id, blob) { await this.tx('readwrite', (st) => st.put(blob, id)); const u = URL.createObjectURL(blob); this.urls.set(id, u); return u; },
  async get(id) {
    if (this.urls.has(id)) return this.urls.get(id);
    let blob = null;
    try { blob = await this.tx('readonly', (st) => st.get(id)); } catch (e) { /* private mode */ }
    if (!blob && Store.connected()) { blob = await Store.getFile(`covers/${id}.jpg`); if (blob) try { await this.tx('readwrite', (st) => st.put(blob, id)); } catch (e) { /* ignore */ } }
    if (!blob) return null;
    const u = URL.createObjectURL(blob); this.urls.set(id, u); return u;
  }
};
function coverSrc(b) { if (!b.coverUrl) return ''; return b.coverUrl.startsWith('local:') ? '' : b.coverUrl; }
function hydrateCovers(root) {
  (root || document).querySelectorAll('img[data-local]').forEach(async (img) => {
    const u = await Covers.get(img.dataset.local); if (u) { img.src = u; img.removeAttribute('data-local'); } else img.remove();
  });
}
function coverImg(b, cls, alt) {
  if (!b.coverUrl) return '';
  if (b.coverUrl.startsWith('local:')) { const k = b.coverUrl.slice(6).split(':')[0]; const u = Covers.urls.get(k); return u ? `<img class="${cls || ''}" src="${u}" alt="${esc(alt || '')}">` : `<img class="${cls || ''}" data-local="${esc(k)}" alt="${esc(alt || '')}">`; }
  return `<img class="${cls || ''}" src="${esc(b.coverUrl)}" alt="${esc(alt || '')}" loading="lazy" onerror="this.remove()">`;
}
async function photoToCover(file) { // centre-crop to 2:3, 600×900 JPEG
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const W = 600, H = 900, r = W / H;
    let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
    if (sw / sh > r) { const nw = sh * r; sx = (sw - nw) / 2; sw = nw; } else { const nh = sw / r; sy = (sh - nh) / 2; sh = nh; }
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    return await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
async function setCoverPhoto(b, file) {
  toast('Fitting the cover…');
  try {
    const blob = await photoToCover(file);
    await Covers.put(b.id, blob);
    saveBook(b.id, { coverUrl: 'local:' + b.id + ':' + Date.now().toString(36) });
    render(); toast('Cover added');
    const buf = new Uint8Array(await blob.arrayBuffer());
    if (Store.connected()) Store.putFile(`covers/${b.id}.jpg`, b64e(buf));
  } catch (e) { toast('That photo couldn’t be used. Try another.'); }
}

/* ================= the model: bindings, sections, reading life, layout, search ================= */
function binding(b) {
  if (b.binding && b.binding.color != null) return b.binding;
  const r = rnd(b.id, 'c');
  // curated old-library palette: mostly browns, then greens/navies, some vellum, a little faded red
  const weights = [10, 9, 8, 7, 8, 6, 7, 7, 4, 7, 5, 4, 8];
  let acc = 0, ci = 0; const tot = weights.reduce((a, c) => a + c, 0);
  for (let i = 0; i < weights.length; i++) { acc += weights[i] / tot; if (r < acc) { ci = i; break; } }
  const zh = isZh(b.title);
  const rs = rnd(b.id, 's');
  let style = zh ? (rs < 0.6 ? 'smooth' : 'label') : (rs < 0.3 ? 'antique' : rs < 0.7 ? 'smooth' : 'label');
  if (ci === 1 || ci === 5) style = 'label'; // light tan leathers: gilt needs a dark lettering piece to read
  return { color: ci, style: STYLES.indexOf(style) };
}
function dims(b) {
  const pages = b.pages || (180 + rnd(b.id, 'p') * 420);
  const wm = Math.min(0.06, Math.max(0.025, 0.019 + pages * 0.00007));
  const hm = b.heightM || (0.245 + rnd(b.id, 'h') * 0.085);
  const base = { w: Math.round(wm * PXM), h: Math.round(hm * PXM) };
  const r = spineFitFor(b, base, STYLES[binding(b).style]); // a long title may widen the spine a little
  return { w: base.w + r.boost, h: base.h, fit: r.f };
}

/* ---------- sections: her own named shelves; genres are the starting set ---------- */
let secMemo = null, secMemoKey = null;
function sections() {
  const mk = S.settings.sections;
  if (secMemo && secMemoKey === mk) return secMemo.slice();
  const saved = (S.settings.sections || []).filter((s) => s && s.id && s.name);
  const have = new Set(saved.map((s) => s.id));
  const out = saved.slice();
  GENRES.forEach((g, i) => { if (!have.has('g:' + g)) { // keep genre order relative to its neighbours
    const prev = GENRES.slice(0, i).reverse().map((x) => out.findIndex((s) => s.id === 'g:' + x)).find((k) => k >= 0);
    out.splice(prev == null ? out.length : prev + 1, 0, { id: 'g:' + g, name: g, genre: g });
  } });
  secMemo = out; secMemoKey = mk;
  return out.slice();
}
function secOf(b) { if (b.sectionId && sections().some((s) => s.id === b.sectionId)) return b.sectionId; return 'g:' + (b.genre || 'Fiction'); }
function secName(id) { const s = sections().find((x) => x.id === id); return s ? s.name : String(id || '').replace(/^g:/, ''); }
function saveSections(list) { saveSettings({ sections: list.map((s) => ({ id: s.id, name: s.name, genre: s.genre || null })) }); }

/* ---------- reading life ---------- */
function status(b) { return b.status || 'read'; }
function readsOf(b) { if (Array.isArray(b.reads) && b.reads.length) return b.reads; return b.dateRead ? [{ finish: b.dateRead }] : []; }
function lastFinish(b) { return readsOf(b).map((r) => r.finish).filter(Boolean).sort().pop() || b.dateRead || null; }
function startedAt(b) { const r = readsOf(b); const last = r[r.length - 1]; return last && !last.finish ? last.start : (b.startedAt || null); }
function statusLabel(b) {
  const st = status(b);
  if (st === 'reading') return b.pausedAt ? `Put aside · ${monthLabel(b.pausedAt)}` : `Reading${startedAt(b) ? ' since ' + monthLabel(startedAt(b)) : ' now'}`;
  if (st === 'want') return 'Want to read';
  const f = lastFinish(b); const n = readsOf(b).filter((r) => r.finish).length;
  return `Read${f ? ' · ' + monthLabel(f) : ''}${n > 1 ? ` · ${n} times` : ''}`;
}
function setStatus(b, st, month) {
  const reads = readsOf(b).map((r) => Object.assign({}, r));
  const m = month || thisMonth();
  const patch = { status: st, pausedAt: null };
  if (st === 'read') { const last = reads[reads.length - 1]; if (last && !last.finish) last.finish = m; else if (!reads.some((r) => r.finish === m)) reads.push({ finish: m }); patch.reads = reads; patch.dateRead = reads.map((r) => r.finish).filter(Boolean).sort().pop() || null; }
  if (st === 'reading') { const last = reads[reads.length - 1]; if (!last || last.finish) reads.push({ start: m }); else last.start = last.start || m; patch.reads = reads; }
  saveBook(b.id, patch);
}
function shelvedOn(b) { // 'shelf' | 'desk' | 'pile'
  const st = status(b);
  if (st === 'reading') return 'desk';
  if (st === 'want') return S.settings.pileMode === 'shelf' ? 'shelf' : 'pile';
  return 'shelf';
}
const deskBooks = () => S.books.filter((b) => shelvedOn(b) === 'desk').sort((a, b) => (a.pausedAt ? 1 : 0) - (b.pausedAt ? 1 : 0) || (b.updatedAt || 0) - (a.updatedAt || 0));
const pileBooks = () => S.books.filter((b) => status(b) === 'want').sort((a, b) => (a.pilePos ?? 1e9) - (b.pilePos ?? 1e9) || (a.createdAt || 0) - (b.createdAt || 0));
const isExample = (b) => !!b.sample;

/* ---------- series ---------- */
function seriesBooks(name) { return S.books.filter((x) => x.series && x.series === name).sort((a, b) => (a.seriesNo ?? 99) - (b.seriesNo ?? 99)); }

/* ---------- layout: sections flow shelf by shelf, three bookcases per wall ---------- */
function orderInSection(list) {
  return list.slice().sort((a, b) => {
    const pa = a.pos ?? 1e9, pb = b.pos ?? 1e9;
    if (pa !== pb) return pa - pb;
    return sortKey(authorSort(a)).localeCompare(sortKey(authorSort(b))) ||
      (a.series && a.series === b.series ? (a.seriesNo ?? 99) - (b.seriesNo ?? 99) : 0) ||
      sortKey(a.title).localeCompare(sortKey(b.title));
  });
}
const DIV_W = 16;
let layoutCache = null, layoutKey = '';
function layout() {
  const key = S.books.length + ':' + S.books.reduce((a, b) => Math.max(a, b.updatedAt || 0), 0) + ':' + (S.settings.updatedAt || 0) + ':' + S.arrange;
  if (layoutCache && key === layoutKey) return layoutCache;
  const inner = GEO.shelves[0].x1 - GEO.shelves[0].x0 - 10;
  const shelves = [];
  let cur = null;
  for (const sec of sections()) {
    const list = orderInSection(S.books.filter((b) => shelvedOn(b) === 'shelf' && secOf(b) === sec.id));
    if (!list.length) { if (S.arrange && !sec.id.startsWith('g:')) { cur = { sec: sec.id, secs: [sec.id], items: [], used: 0, empty: sec.id }; shelves.push(cur); cur = null; } continue; }
    const need = list.reduce((a, b) => a + dims(b).w + 1, 0);
    const share = cur && cur.used + DIV_W + need <= inner && (list.length <= 3 || cur.used / inner < 0.4);
    if (share) { cur.items.push({ div: sec.id, d: { w: DIV_W } }); cur.used += DIV_W; cur.secs.push(sec.id); }
    else { cur = { sec: sec.id, secs: [sec.id], items: [], used: 0 }; shelves.push(cur); }
    for (const b of list) {
      const d = dims(b);
      if (cur.used + d.w + 1 > inner) { cur = { sec: sec.id, secs: [sec.id], items: [], used: 0 }; shelves.push(cur); }
      cur.items.push({ b, d }); cur.used += d.w + 1;
    }
  }
  shelves.forEach((s) => { s.fill = s.used / inner; });
  const cases = [];
  for (let i = 0; i < shelves.length; i += 3) cases.push(shelves.slice(i, i + 3));
  layoutCache = { shelves, cases, pages: Math.max(1, Math.ceil(cases.length / 3)) }; layoutKey = key;
  return layoutCache;
}
function caseTitle(L, ci) {
  const sh = L.cases[ci] || []; const m = {};
  sh.forEach((s) => s.items.forEach((it) => { if (it.b) { const k = secOf(it.b); m[k] = (m[k] || 0) + 1; } }));
  const ks = Object.keys(m).sort((a, b) => m[b] - m[a]);
  return ks.length ? secName(ks[0]) : 'An empty bookcase';
}
function locate(id) {
  const L = layout();
  for (let ci = 0; ci < L.cases.length; ci++) for (let si = 0; si < L.cases[ci].length; si++) {

/* ---------- dust drifting in the lamp light ---------- */
const Atmos = {
  raf: 0, parts: null, last: 0,
  start() {
    cancelAnimationFrame(this.raf); this.raf = 0;
    const c = document.getElementById('dust');
    if (!c || REDUCED.matches || document.hidden || S.view !== 'wall' || S.settings.quietMotion) return;
    const k = Math.min(2, (S.scale || 1) * (devicePixelRatio || 1));
    const W = 1180, H = 460, Y0 = 60;
    c.width = Math.round(W * k); c.height = Math.round(H * k); c.style.cssText = `left:0;top:${Y0}px;width:${W}px;height:${H}px`;
    const g = c.getContext('2d');
    if (!this.parts) this.parts = Array.from({ length: 45 }, (_, i) => { const h = HOODS[i % 3]; return { x: h[0] + (Math.random() - 0.5) * 200, y: Math.random() * H, r: 0.5 + Math.random() * 1.1, a: 0.06 + Math.random() * 0.26, s: Math.random() * 1000, tw: 0 }; });
    const P = this.parts;
    const tick = (t) => {
      if (!c.isConnected || S.view !== 'wall' || document.hidden) { this.raf = 0; return; }
      const dt = Math.min(0.05, (t - (this.last || t)) / 1000); this.last = t;
      g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, W, H);
      if (!S.zoom) for (const p of P) {
        const n = Math.sin(p.s + t * 0.00031) + Math.sin(p.s * 1.7 + t * 0.00017);
        p.x += (n * 4) * dt; p.y += (-6 + Math.cos(p.s + t * 0.00023) * 5) * dt;
        if (p.y < -4) { p.y = H + 4; const h = HOODS[Math.floor(Math.random() * 3)]; p.x = h[0] + (Math.random() - 0.5) * 220; }
        if (Math.random() < 0.0004) p.tw = 0.3;
        if (p.tw > 0) p.tw -= dt;
        // brightness from the nearest lamp cone
        let m = 0; for (const h of HOODS) { const wy = 60 + (p.y / H) * 150; const d = Math.abs(p.x - h[0]) / wy; m = Math.max(m, Math.max(0, 1 - d * d) * (1 - p.y / H * 0.6)); }
        const al = p.a * m * (p.tw > 0 ? 1.6 : 1);

      }

    };

  }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) Atmos.start(); });

/* ---------- motes: a little burst of gold (search found, new book) ---------- */

/* ---------- optional sound (Settings, off by default): synthesised, no files ---------- */
let AC = null;
function sound(kind) {
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const noise = (dur, f0, f1, gain) => {
      const buf = AC.createBuffer(1, Math.ceil(AC.sampleRate * dur), AC.sampleRate); const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5);
      const s = AC.createBufferSource(); s.buffer = buf;
      const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = 0.8;
      const g = AC.createGain(); g.gain.value = gain;
      s.connect(f).connect(g).connect(AC.destination); s.start(t);
    };
    const thump = (fr, dur, gain) => { const o = AC.createOscillator(); o.frequency.setValueAtTime(fr, t); o.frequency.exponentialRampToValueAtTime(fr * 0.5, t + dur); const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur); };
    if (kind === 'page') noise(0.32, 2400, 700, 0.06);
    else if (kind === 'drawer') { noise(0.34, 500, 180, 0.08); thump(90, 0.12, 0.05); }
    else if (kind === 'seal') thump(120, 0.16, 0.12);
    else if (kind === 'card') noise(0.08, 3000, 1800, 0.04);
    else if (kind === 'book') { noise(0.22, 900, 400, 0.05); thump(140, 0.1, 0.04); }
  } catch (e) { /* no audio */ }
}

/* ---------- your year in books ---------- */
function yearData(y) {
  const ys = String(y);
  const pool = S.books.filter((b) => !b.sample).length ? S.books.filter((b) => !b.sample) : S.books;
  const done = pool.filter((b) => readsOf(b).some((r) => (r.finish || '').startsWith(ys)));
  const count = (arr) => { const m = {}; arr.forEach((x) => { m[x] = (m[x] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const feel = count(done.flatMap((b) => b.feelings || []));
  const top = done.filter((b) => b.rating != null).sort((a, b) => b.rating - a.rating)[0];
  const linked = done.map((b) => ({ b, n: S.books.filter((x) => (x.links || []).includes(b.id)).length + (b.links || []).length })).sort((a, b) => b.n - a.n)[0];
  const quote = done.flatMap((b) => (b.quotes || []).filter((q) => (q.text || '').trim()).map((q) => ({ q, b }))).pop();
  const authors = count(done.map((b) => b.author).filter(Boolean)).filter((a) => a[1] > 1);
  const pages = done.reduce((a, b) => a + (+b.pages || 0), 0);
  const months = Array.from({ length: 12 }, (_, i) => done.filter((b) => readsOf(b).some((r) => r.finish === `${ys}-${String(i + 1).padStart(2, '0')}`)));
  return { y, done, feel, top, linked: linked && linked.n ? linked.b : null, quote, authors, pages, months };
}

async function shareOrSave(blob, name, type) {
  const file = new File([blob], name, { type });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; } } catch (e) { if (e && e.name === 'AbortError') return false; }

}

function systemTextSize() { // follow iOS Larger Text when she hasn't chosen a size here

/* ---------------- book details & covers: Open Library + Google Books ---------------- */
const GENRE_RULES = [
  [/fantasy|magic|wizard|juvenile|children|fairy/i, 'Fantasy & Childhood'],
  [/poetry|poems|drama|plays|theatre|theater/i, 'Poetry & Drama'],
  [/biograph|memoir|autobiograph|diaries|letters/i, 'Biography & Memoir'],
  [/philosoph|religio|buddhis|christian|taoism|confucian|ethics|stoic/i, 'Philosophy & Religion'],
  [/essays|criticism|literary criticism/i, 'Essays & Criticism'],
  [/history|historical(?! fiction)|war, \d|civilization|ancient/i, 'History'],
  [/politic|economic|sociology|social science|law|feminism/i, 'Society & Ideas'],
  [/science|nature|biology|physics|mathemat|ecology|natural history|medicine/i, 'Science & Nature'],
  [/\bart\b|design|architecture|photograph|painting|music/i, 'Art & Design'],
  [/travel|cooking|food|wine|voyages/i, 'Travel & Food'],
  [/fiction|novel|stories/i, 'Fiction']
];
function guessGenre(subjects, title, author) {
  const s = (subjects || []).join(' | ');
  if (isZh(title) || isZh(author)) {
    if (/history|歷史|历史/i.test(s)) return 'History';
    if (/biograph|傳記|传记|memoir|回憶/i.test(s)) return 'Biography & Memoir';
    if (/philosoph|哲學|religio/i.test(s)) return 'Philosophy & Religion';
    return 'Chinese Literature';
  }
  if (/fiction/i.test(s) && !/juvenile|fantasy/i.test(s)) return 'Fiction';
  for (const [re, g] of GENRE_RULES) if (re.test(s)) return g;
  return 'Fiction';
}
const olCover = (d) => d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg` : null;
const gbCover = (v) => { const l = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail); return l ? l.replace(/^http:/, 'https:').replace('&edge=curl', '') + '&fife=w600' : null; };
const stripHtml = (s) => String(s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const clip = (s, n) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s;
async function getJSON(url) { const r = await fetch(url, { signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined }); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
async function searchOL(q) {
  const j = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=6&fields=key,title,author_name,first_publish_year,isbn,cover_i,number_of_pages_median,subject,language,publisher`);
  return (j.docs || []).map((d) => ({
    src: 'Open Library', title: d.title, author: (d.author_name || [])[0] || null, year: d.first_publish_year || null,
    publisher: (d.publisher || [])[0] || null, pages: d.number_of_pages_median || null, isbn: (d.isbn || []).find((x) => x.length === 13) || (d.isbn || [])[0] || null,
    subjects: (d.subject || []).slice(0, 8), coverUrl: olCover(d), olKey: d.key, language: (d.language || [])[0] || null, synopsis: ''
  }));
}
async function searchGB(q) {
  const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=6&printType=books`);
  return (j.items || []).map((it) => { const v = it.volumeInfo || {}; return {
    src: 'Google Books', title: v.title + (v.subtitle && v.subtitle.length < 40 ? '' : ''), author: (v.authors || [])[0] || null, year: v.publishedDate ? +String(v.publishedDate).slice(0, 4) || null : null,
    publisher: v.publisher || null, pages: v.pageCount || null, isbn: ((v.industryIdentifiers || []).find((x) => x.type === 'ISBN_13') || {}).identifier || null,
    subjects: v.categories || [], coverUrl: gbCover(v), language: v.language || null, synopsis: clip(stripHtml(v.description), 700)
  }; });
}
async function findBooks(q) {
  const zh = isZh(q);
  const [a, b] = await Promise.allSettled([searchOL(q), searchGB(q)]);
  const ol = a.status === 'fulfilled' ? a.value : [], gb = b.status === 'fulfilled' ? b.value : [];
  if (a.status === 'rejected' && b.status === 'rejected') throw new Error('offline');
  const first = zh ? gb : ol, second = zh ? ol : gb;
  const out = [];
  const key = (x) => sortKey(x.title).replace(/[^a-z0-9㐀-鿿]/g, '').slice(0, 24) + '|' + sortKey(x.author || '').slice(0, 8);
  const seen = new Map();
  for (const x of first.concat(second)) {
    const k = key(x);
    if (seen.has(k)) { const y = seen.get(k); y.coverUrl = y.coverUrl || x.coverUrl; y.synopsis = y.synopsis || x.synopsis; y.pages = y.pages || x.pages; y.isbn = y.isbn || x.isbn; y.subjects = y.subjects.length ? y.subjects : x.subjects; continue; }
    seen.set(k, x); out.push(x);
  }
  out.forEach((x) => {
    x.genre = guessGenre(x.subjects, x.title, x.author);
    const m = /\s*\(([^()#]+?),?\s*#\s*(\d+(?:\.\d+)?)\)\s*$/.exec(x.title || '');
    if (m) { x.series = m[1].trim(); x.seriesNo = +m[2]; x.title = x.title.slice(0, m.index).trim(); }
  });

}
async function olSynopsis(olKey) {
  try { const w = await getJSON(`https://openlibrary.org${olKey}.json`); const d = w.description; return clip(stripHtml(typeof d === 'string' ? d : d && d.value), 700); } catch (e) { return ''; }
}
async function enrichBook(b) {
  const q = [b.title, b.author].filter(Boolean).join(' ');
  const c = (await findBooks(q))[0];
  if (!c) return null;
  let syn = c.synopsis;
  if (!syn && c.olKey && !b.synopsis) syn = await olSynopsis(c.olKey);
  const patch = { enriched: true };
  if (c.coverUrl && !b.coverUrl) patch.coverUrl = c.coverUrl;
  if (c.pages && !b.pages) patch.pages = c.pages;
  if (c.isbn && !b.isbn) patch.isbn = c.isbn;
  if (c.publisher && !b.publisher) patch.publisher = c.publisher;
  if (syn && !b.synopsis) patch.synopsis = syn;
  if (c.subjects && c.subjects.length && !(b.subjects && b.subjects.length)) patch.subjects = c.subjects.slice(0, 6);

}
let enriching = false;
const tried = new Set();
async function enrichAll(force) {
  if (force) tried.clear();
  if (enriching) return; enriching = true; // a running pass picks up newly added books on its next step
  let n = 0;
  const next = () => S.books.filter((b) => !tried.has(b.id) && (force ? !b.coverUrl : !b.enriched))
    .sort((a, b) => (a.sample ? 1 : 0) - (b.sample ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0))[0]; // her own books first, newest first
  for (let b = next(); b; b = next()) {
    tried.add(b.id);
    try {
      const p = await enrichBook(b);
      saveBook(b.id, p || { enriched: true }, true);
      if (p && p.coverUrl) { n++; if (!b.sample && ['wall', 'list', 'book'].includes(S.view)) { layoutCache = null; render(); } }
    } catch (e) { if (String(e.message) === 'offline') break; }
    await new Promise((r) => setTimeout(r, 350));
  }
  enriching = false;
  if (n) { toast(`Found ${plural(n, 'cover')}`); if (S.view === 'book' || S.view === 'list') render(); }
}


async function coverChoices(b) {
  const q = [b.title, b.author].filter(Boolean).join(' ');
  const c = await findBooks(q).catch(() => []);
  const urls = c.map((x) => x.coverUrl).filter(Boolean);
  try { const j = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=12&fields=cover_i,edition_key`); (j.docs || []).forEach((d) => { if (d.cover_i) urls.push(`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`); }); } catch (e) { /* offline */ }

}

function linkFromHash() { // "#link=…" from another device's QR code
  const m = /#link=([^&]+)/.exec(location.hash); if (!m) return false;
  try { const j = JSON.parse(b64d(decodeURIComponent(m[1]))); if (j.r && j.t) { Store.gh = { repo: j.r, token: j.t }; LS.set('library.github', Store.gh); } } catch (e) { /* ignore */ }

}

  const all = S.books.flatMap((b) => (b.quotes || []).filter((q) => (q.text || '').trim().length > 12).map((q) => ({ q, b })));
  if (all.length < 2) return;
  const pick = all[hash(today) % all.length];
  LS.set('library.qod', today);
  setTimeout(() => letter('A line from your shelves', `“${esc(pick.q.text)}”`, `${esc(pick.b.title)}${pick.b.author ? ' · ' + esc(pick.b.author) : ''}${pick.q.page ? ' · p. ' + esc(pick.q.page) : ''}`), 1400);
}

}
(async () => {
  updateMode();
  linkFromHash();

/* Service worker registration for The Library. Paste just before </body>.
 * When a new version is installed and waiting, this dispatches a window event
 * "library:update-ready" (and calls window.onLibraryUpdateReady() if defined).
 * Show a "New version — reload" control that calls window.applyUpdate().
 */
(function () {
  if (!('serviceWorker' in navigator)) { window.applyUpdate = function () { location.reload(); }; return; }
  var reg = null, notified = false, reloading = false, wantReload = false;

  function notify() {
    if (notified) return; notified = true;
    window.libraryUpdateReady = true;
    window.dispatchEvent(new CustomEvent('library:update-ready'));

  }

  window.applyUpdate = function () {
    var w = reg && (reg.waiting || reg.installing);
    if (!w) { location.reload(); return; }

  // Only reload when the user asked for the update (not on the very first install's clients.claim()).
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!wantReload || reloading) return;
    reloading = true;
    location.reload();
  });

  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'UPDATE_READY') notify();
  });

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(function (r) {
      reg = r;
      if (r.waiting && navigator.serviceWorker.controller) notify();
      r.addEventListener('updatefound', function () {
        var nw = r.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) notify();
        });
      });
      // Home-screen PWAs rarely restart; check for a new version whenever the app is brought back.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') r.update().catch(function () {});
      });
    }).catch(function (err) { console.warn('SW registration failed', err); });
  });
})();
