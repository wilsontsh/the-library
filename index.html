<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="theme-color" content="#0b0c0c">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="wall.jpg" as="image">
<link rel="preload" href="fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/eb-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<title>The Library</title>
<style>
/* Layout: a fixed 1180×820 "room" stage scaled to the screen; the rendered room is the hero, UI recedes like museum labels. */
:root{
  --surround:#070809;
  --text:#f3ecdc; --muted:#c2b8a2; --faint:#948b78;
  --gilt:#d4b97a; --gilt-deep:#9f7d3c; --line:rgba(212,185,122,.26);
  --glass:rgba(48,40,32,.62); --glass-hi:rgba(66,56,44,.74);
  --ink:#2a1e14; --ink-muted:#6b5a42; --ink-red:#7a2a1f; --ink-line:rgba(70,50,30,.32);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-book:"EB Garamond","PingFang TC","Noto Sans TC",Georgia,serif;
  --f-display:"Cormorant Garamond","PingFang TC","Noto Sans TC",Georgia,serif;
  --f-type:"Courier Prime","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--surround);color:var(--text);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;overflow:hidden}
.viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#16120e 0,#0a0908 60%,#060606 100%);touch-action:manipulation}
.stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;overflow:hidden;background:#0b0c0c;will-change:transform;box-shadow:0 0 80px 30px rgba(0,0,0,.55)}
.stage.pan{transition:transform .62s cubic-bezier(.22,.72,.18,1)}
.view.wallview{touch-action:none}
.ui{position:fixed;inset:0;z-index:50;pointer-events:none}
.ui .topbar,.ui .bottombar,#chrome{pointer-events:none}
.ui .topbar>*,.ui .bottombar>*,.ui .scrim,.ui .toast,.ui .arrange-banner,.ui .empty-note,.ui .pscroll,.ui .pcat,.ui .card-nav{pointer-events:auto}
button,.pick,.spine,.icon-btn,.primary,.menu-item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.view{position:absolute;inset:0}
.bg{position:absolute;left:0;top:0;width:1180px;height:820px;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}

/* ---------- quiet chrome ---------- */
.topbar{position:absolute;left:0;right:0;top:0;height:calc(84px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;padding:env(safe-area-inset-top) max(28px,env(safe-area-inset-right)) 0 max(28px,env(safe-area-inset-left));box-sizing:border-box;background:linear-gradient(180deg,rgba(6,7,7,.62),rgba(6,7,7,0));z-index:40}
.wordmark{display:flex;flex-direction:column;margin-right:auto;gap:2px}
.wordmark b{font-family:var(--f-display);font-weight:600;font-size:27px;letter-spacing:.01em;color:var(--gilt);line-height:1}
.wordmark span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.search{position:relative;display:flex;align-items:center;gap:8px;width:300px;height:44px;padding:0 14px;box-sizing:border-box;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:16px var(--f-ui)}
.search input::placeholder{color:var(--faint)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;min-width:44px;padding:0 12px;box-sizing:border-box;border-radius:22px;background:var(--glass);border:1px solid var(--line);color:var(--text);font-size:14px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (hover:hover){.icon-btn:hover{background:var(--glass-hi)}.ghost:hover{color:var(--text)}.result:hover{background:rgba(212,185,122,.1)}}
.icon-btn:active,.pick:active,.cand:active,.menu-item:active,.seg button:active{filter:brightness(1.25)}
.icon-btn svg{flex-shrink:0}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 6px;box-sizing:border-box;border-style:solid;border-width:12px 16px;border-image:url(ui_brass.png) 62 70 fill / 12px 16px stretch;background:none;color:#2a1c09;font:600 15px var(--f-ui);text-shadow:0 1px 0 rgba(255,240,205,.5);cursor:pointer;white-space:nowrap}
.primary:active{filter:brightness(.92)}
.ghost{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:10px 8px;min-height:44px}
.results{position:absolute;top:52px;right:0;width:360px;max-height:420px;overflow:auto;border-radius:12px;background:rgba(14,16,15,.94);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.6);padding:6px;z-index:60}
.result{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
.result:focus{background:rgba(212,185,122,.1)}
.result .sw{width:10px;height:34px;border-radius:2px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.result b{display:block;font:500 16px var(--f-book);color:var(--text)}
.result small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.bottombar{position:absolute;left:0;right:0;bottom:0;height:calc(92px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(28px,env(safe-area-inset-left));box-sizing:border-box;z-index:30;background:linear-gradient(0deg,rgba(6,7,7,.5),rgba(6,7,7,0))}
.pager{display:flex;align-items:center;gap:10px}
.pager .where{font-size:13px;color:var(--muted);min-width:170px;text-align:center}
.cases{display:flex;gap:6px;align-items:flex-end}
.case-dot{width:30px;height:38px;border-radius:2px;border:1px solid rgba(212,185,122,.18);background:rgba(10,10,9,.6);cursor:pointer;padding:0;position:relative;overflow:hidden}
.case-dot i{position:absolute;left:3px;right:3px;height:2px;background:rgba(212,185,122,.25)}
.case-dot.on{border-color:var(--gilt);box-shadow:0 0 8px rgba(212,185,122,.35)}
.reading{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.reading b{font:500 15px var(--f-book);color:var(--text)}
.toast{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));max-width:calc(100vw - 40px);box-sizing:border-box;text-align:center;transform:translateX(-50%);padding:11px 18px;border-radius:22px;background:rgba(14,16,15,.92);border:1px solid var(--line);font-size:14px;color:var(--text);z-index:90;transition:opacity .3s}

/* ---------- the wall ---------- */
.wall{position:absolute;inset:0;transform-origin:0 0;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.plate{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#2b1f0e;text-shadow:0 1px 0 rgba(255,236,190,.35),0 -1px 0 rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;opacity:.92}
.shelf{position:absolute;display:flex;align-items:flex-end;gap:1px;padding:0 4px;box-sizing:border-box}
.shelf .genre-tag{z-index:6}.shelf::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42) 0,rgba(0,0,0,.1) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.08) 100%);z-index:3}
.shelf .genre-tag{position:absolute;left:8px;bottom:-12px;font-size:10.5px;letter-spacing:.04em;color:rgba(240,222,180,.85);text-shadow:0 1px 2px rgba(0,0,0,.8);z-index:4;pointer-events:none}
.spine{position:relative;flex-shrink:0;padding:0;border:0;cursor:pointer;background-repeat:no-repeat;border-radius:2px 2px 1px 1px;box-shadow:1px 0 1px rgba(0,0,0,.6),-1px 0 1px rgba(0,0,0,.35);transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,.7,.2,1),filter .3s,box-shadow .3s;z-index:1}
.spine.lean{transform-origin:100% 100%}
.spine .t{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#d3b878;text-shadow:0 -.5px 0 rgba(0,0,0,.7),0 .5px 0 rgba(255,236,190,.18);pointer-events:none;line-height:1;white-space:nowrap}
.spine .t.v{writing-mode:vertical-rl;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.spine .t.zh{writing-mode:vertical-rl;text-orientation:upright;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-weight:500;letter-spacing:.08em}
.spine .t.h{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:normal;text-align:center;line-height:1.05;padding:0 2px}
.spine.light .t{color:#3a2614;text-shadow:none}
.spine.dim{filter:brightness(.38) saturate(.6)}
.spine.found{transform:translateY(-12px);filter:brightness(1.12);box-shadow:0 0 0 1px rgba(255,226,170,.75),0 0 18px 4px rgba(255,200,120,.32),0 12px 16px rgba(0,0,0,.6);z-index:5}
.spine.lift{transform:translateY(-16px) scale(1.03);z-index:6}
.spine.dragging{opacity:.25}
.drag-ghost{position:absolute;z-index:200;pointer-events:none;transform:rotate(6deg);box-shadow:16px 22px 26px rgba(0,0,0,.65)}
.insert{position:absolute;width:4px;border-radius:2px;background:linear-gradient(#fff3cf,#d4b97a);box-shadow:0 0 12px 4px rgba(255,214,140,.55);z-index:150;pointer-events:none}
.wall.zoomed .shelf:not(.z){filter:brightness(.4)}.wall.zoomed .plate{opacity:.4}.shelf{transition:filter .4s}
.arrange-banner{position:absolute;left:50%;top:calc(92px + env(safe-area-inset-top));max-width:calc(100vw - 24px);box-sizing:border-box;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:6px 6px 6px 18px;border-radius:26px;background:rgba(14,16,15,.9);border:1px solid var(--line);z-index:45;font-size:14px;color:var(--text)}
.empty-note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 40px));box-sizing:border-box;text-align:center;padding:26px;border-radius:14px;background:rgba(10,11,10,.82);border:1px solid var(--line);z-index:10}
.empty-note h2{margin:0 0 8px;font:600 26px var(--f-display);color:var(--gilt)}
.empty-note p{margin:0 0 16px;font:17px/1.5 var(--f-book);color:var(--text)}

/* ---------- open book ---------- */
.page{position:absolute;color:var(--ink)}
.page .multiply{mix-blend-mode:multiply}
.kicker{font:500 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.btitle{margin:6px 0 0;font:600 36px/1.04 var(--f-display);color:#1f150c;text-wrap:balance}
.bsub{margin-top:6px;font:17px var(--f-book);color:#3b2a1a}
.bzh{margin-top:4px;font:15px "PingFang TC","Noto Sans TC",sans-serif;letter-spacing:.06em;color:#4a3826}
.stars{display:inline-flex;gap:2px}
.star{position:relative;display:inline-block;width:24px;height:24px;font-size:24px;line-height:24px;color:rgba(110,80,30,.25)}
.star span{position:absolute;left:0;top:0;overflow:hidden;color:#93681c}
.star button{position:absolute;top:0;width:50%;height:100%;padding:0;border:0;background:none;cursor:pointer}
.star.dark{color:rgba(212,185,122,.25)} .star.dark span{color:var(--gilt)}
.meta{margin:0;font:15px var(--f-book)}
.meta div{display:flex;gap:12px;padding:6px 0;border-bottom:1px dotted var(--ink-line)}
.meta dt{width:76px;flex-shrink:0;font:500 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding-top:3px}
.meta dd{margin:0;min-width:0}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:14px;border:1px solid rgba(122,42,31,.4);font:14px var(--f-book);color:var(--ink-red);background:none;cursor:pointer}
.chip.on{background:rgba(122,42,31,.1)}
.chip.add{border-style:dashed;color:var(--ink-muted);border-color:var(--ink-line)}
.ribbons{position:absolute;left:40px;top:-6px;display:flex;gap:10px;z-index:2}
.ribbon{width:70px;padding:16px 0 0;display:flex;justify-content:center;align-items:flex-start;border:0;background-image:url(silk.jpg);background-size:100% 100%;background-blend-mode:multiply;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 12px),0 100%);color:#f7eedb;font:500 13px var(--f-ui);letter-spacing:.02em;text-shadow:0 1px 1px rgba(0,0,0,.5);filter:drop-shadow(1px 3px 2px rgba(40,25,10,.4));cursor:pointer;transition:height .3s}
.sec-h{display:flex;align-items:baseline;justify-content:space-between}
.sec-h h2{margin:0;font:600 24px var(--f-display);color:#1f150c}
.sec-h span{font:12px var(--f-ui);color:var(--ink-muted)}
.inkarea{width:100%;box-sizing:border-box;border:0;background:transparent;resize:none;outline:none;color:var(--ink);font:17px/1.62 var(--f-book);padding:0}
.inkarea::placeholder{color:rgba(107,90,66,.6)}
.inkarea:focus{background:rgba(255,250,235,.18)}
.pull{font:500 20px/1.35 var(--f-display);color:var(--ink-red);border-top:1px solid rgba(122,42,31,.35);border-bottom:1px solid rgba(122,42,31,.35);padding:8px 0}
.pull::placeholder{color:rgba(122,42,31,.45)}
.lined{background:repeating-linear-gradient(180deg,transparent 0 33px,rgba(60,45,30,.16) 33px 34px);line-height:34px}
.quote{padding:8px 0 8px 16px;border-left:2px solid rgba(122,42,31,.5);margin:10px 0}
.quote textarea{font:italic 18px/1.5 var(--f-book)}
.quote input{width:120px;border:0;background:none;font:16px var(--f-ui);color:var(--ink-muted);outline:none}
.pg-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--ink-line);background:none;color:var(--ink-muted);font:13px var(--f-ui);cursor:pointer}
.cover{position:relative;width:150px;height:225px;border-radius:1px 4px 4px 1px;box-shadow:3px 6px 12px rgba(60,40,20,.4);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.cover::before{content:"";position:absolute;inset:9px;border:1px solid rgba(212,185,122,.7);box-shadow:inset 0 0 0 4px transparent,inset 0 0 0 5px rgba(212,185,122,.35)}
.cover b{position:relative;font:700 16px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:#e3c987;padding:0 18px}
.cover small{position:relative;font:600 10px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#cdb172}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate-name{position:absolute;left:0;right:0;top:56%;text-align:center;font:600 24px var(--f-display);color:#6a2018}
.saved{font:12px var(--f-ui);color:var(--ink-muted)}

/* ---------- sheets (menu, add, ledger) ---------- */
.scrim{position:absolute;inset:0;background:rgba(4,5,5,.58);z-index:100;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);box-sizing:border-box}
.scrim.enter{animation:fade .28s ease-out}.scrim.enter .sheet{animation:rise .42s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(28px) scale(.985);opacity:0}}
.sheet{position:relative;box-sizing:border-box;border-style:solid;border-width:26px;border-image:url(ui_leather.png) 58 fill / 26px stretch;color:var(--text);max-width:100%;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;margin-top:16px}
.feel-row{display:flex;gap:10px;align-items:flex-start}.feel-row>.note{width:84px;flex-shrink:0;padding-top:8px}.feel-row>div{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.sheet h2{margin:0;font:600 28px var(--f-display);color:var(--gilt)}
.sheet .lede{margin:4px 0 0;font:16px/1.45 var(--f-book);color:var(--muted)}
.sheet label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.sheet input[type=text],.sheet input[type=search],.sheet input[type=number],.sheet input[type=month],.sheet select,.sheet textarea{box-sizing:border-box;width:100%;min-height:42px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.18);color:var(--text);font:16px var(--f-ui);outline:none;-webkit-appearance:none;appearance:none}
.sheet textarea{font:16px/1.5 var(--f-book);resize:vertical}
.sheet .row{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:22px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.seg button{min-height:36px;padding:0 14px;white-space:nowrap;border:0;border-radius:18px;background:none;color:var(--muted);font-size:14px;cursor:pointer}
.seg button.on{background:rgba(212,185,122,.18);color:var(--text)}
.pick{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,240,210,.06);color:var(--text);font:14.5px var(--f-book);cursor:pointer}
.pick.on{background:rgba(212,185,122,.22);border-color:rgba(212,185,122,.75);color:#fff6df}
.cand{display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);text-align:left;cursor:pointer;color:var(--text)}
.cand.on{border-color:var(--gilt);background:rgba(212,185,122,.1)}
.cand b{display:block;font:600 19px/1.15 var(--f-display)}
.cand small{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 6px;border:0;border-bottom:1px solid rgba(212,185,122,.12);background:none;color:var(--text);font-size:16px;text-align:left;cursor:pointer}
.menu-item small{display:block;font-size:12px;color:var(--muted)}
.swatch{width:30px;height:38px;border-radius:2px;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.swatch.on{border-color:var(--gilt)}
.note{font-size:13px;color:var(--muted)}
.err{font-size:14px;color:#e2a68f}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(212,185,122,.3);border-top-color:var(--gilt);animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- catalogue ---------- */
.dlabel{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font:600 9px/1 var(--f-ui);color:#2b2219;overflow:hidden;filter:blur(.4px);opacity:.88;pointer-events:none}
.drawer-hit{position:absolute;padding:0;border:0;background:none;cursor:pointer;border-radius:2px}
.drawer-hit.on{box-shadow:0 0 0 2px rgba(240,212,150,.85),0 0 16px 3px rgba(240,200,120,.3)}
.cardtext{position:absolute;font:12.5px/19px var(--f-type);color:#26211c;mix-blend-mode:multiply;overflow:hidden}
.cardtext .zh{font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:12px}
.card-nav{position:absolute;display:flex;align-items:center;gap:10px;z-index:5}


/* ---------- portrait / phone ---------- */
.lbl{white-space:nowrap}
.search-toggle{display:none}
body.compact .topbar{height:auto;min-height:calc(60px + env(safe-area-inset-top));flex-wrap:wrap;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(6,7,7,.86),rgba(6,7,7,.6) 70%,rgba(6,7,7,0))}
body.compact .wordmark{min-width:0;flex:1 1 0}

.menu-item.on{color:var(--gilt)}
.sh3{margin:22px 0 6px;font:600 20px var(--f-display);color:var(--gilt)}
.feelgroups{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.feel-row>div input{min-height:36px!important;flex:1;margin-right:6px}
.more-d{margin-top:14px;border-top:1px solid rgba(212,185,122,.15);padding-top:10px}
.more-d summary{cursor:pointer;color:var(--text);font-size:15px;min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
.more-d summary::before{content:"›";display:inline-block;transition:transform .2s;color:var(--gilt);font-size:18px}
.more-d[open] summary::before{transform:rotate(90deg)}
.more-d summary::-webkit-details-marker{display:none}
.sel{position:relative;display:block}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select{padding-right:36px!important}
.sheet input[type=password],.sheet input[type=email]{box-sizing:border-box;width:100%;min-height:42px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.18);color:var(--text);font:16px var(--f-ui);outline:none;-webkit-appearance:none;appearance:none}
.covpick{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.covpick button{flex-shrink:0;width:64px;height:96px;padding:0;border:1px solid var(--line);border-radius:2px;background:rgba(0,0,0,.2);cursor:pointer;overflow:hidden}
.covpick img{width:100%;height:100%;object-fit:cover}
.llist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:52vh;overflow:auto}
.cand .sw{width:10px;align-self:stretch;border-radius:2px;flex-shrink:0}
.cands{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cthumb{width:38px;height:56px;object-fit:cover;border-radius:1px 3px 3px 1px;flex-shrink:0;box-shadow:2px 3px 6px rgba(0,0,0,.5)}
.cthumb.blank{display:block;background:rgba(212,185,122,.12)}
.qwrap{position:relative;flex:1;min-width:0}
.qwrap input{padding-right:46px!important}
.scanbtn{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--gilt);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.wide-seg{display:flex;width:100%;box-sizing:border-box}.wide-seg button{flex:1;padding:0 8px}
.reads{display:flex;flex-direction:column;gap:8px}
.readrow{display:flex;gap:10px;align-items:flex-end}.readrow label{flex:1}
.desklist{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.deskrow{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(212,185,122,.12)}
.dthumb{position:relative;width:52px;height:78px;flex-shrink:0;border:0;border-radius:1px 3px 3px 1px;overflow:hidden;box-shadow:2px 3px 8px rgba(0,0,0,.5);cursor:pointer;padding:0}
.dthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dt{min-width:0;flex:1}.dt b{display:block;font:600 19px/1.2 var(--f-display)}.dt small{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.lede.big{font-size:19px;color:var(--text);margin-top:10px}
.mstrip{display:flex;gap:6px;align-items:flex-end;margin-top:16px;height:70px;padding:0 2px;border-bottom:1px solid rgba(212,185,122,.2)}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.mstack{display:flex;flex-direction:column-reverse;gap:1px;width:100%;align-items:center}
.mstack i{display:block;width:70%;height:6px;border-radius:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.mcol span{font-size:10px;color:var(--muted);padding-bottom:2px}
.lrow2{display:flex;justify-content:space-between;width:100%;padding:9px 0;min-height:44px;box-sizing:border-box;border:0;border-bottom:1px solid rgba(212,185,122,.12);background:none;color:var(--text);font:16px var(--f-book);cursor:pointer;text-align:left;align-items:center}
.lrow2 .num{color:var(--muted);font-variant-numeric:tabular-nums}
.parchment-sheet{border-image:none!important;border:0!important;padding:24px 26px;background:url(parchment.jpg) 0 0/100% auto repeat-y,#e9dcc0;color:var(--ink);border-radius:4px;box-shadow:inset 0 0 40px rgba(120,86,40,.35),0 30px 60px rgba(0,0,0,.6)}
.parchment-sheet h2{color:#1f150c!important}.parchment-sheet .lede{color:var(--ink-muted)}.parchment-sheet .xbtn{color:var(--ink-muted)}
.parchment-sheet input[type=search]{background:rgba(255,250,235,.4)!important;color:var(--ink)!important;border-color:var(--ink-line)!important}
.cqlist{margin-top:14px}
.cpb{padding:10px 0 14px;border-bottom:1px solid var(--ink-line)}
.cpbh{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink);min-height:40px}
.cpbh b{font:600 20px var(--f-display)}.cpbh small{display:block;font:13px var(--f-ui);color:var(--ink-muted)}
.cpb blockquote{margin:10px 0 0;padding-left:14px;border-left:2px solid rgba(122,42,31,.5);font:italic 18px/1.5 var(--f-book);color:#2a1e14}
.cpb cite{display:block;font:normal 12px var(--f-ui);color:var(--ink-muted);margin-top:4px}
.writer-sheet{display:flex;flex-direction:column}
.writer{flex:1;width:100%;min-height:200px;margin-top:12px;border:0!important;background:transparent!important;color:var(--ink)!important;font:19px/1.65 var(--f-book)!important;resize:none;outline:none;padding:0!important}
.writer.lined{background:repeating-linear-gradient(180deg,transparent 0 33px,rgba(60,45,30,.16) 33px 34px)!important;line-height:34px!important}
.writer-sheet .primary{flex-shrink:0}
.ypages{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -4px 0;padding:4px 4px 10px;-webkit-overflow-scrolling:touch}
.ypage{flex:0 0 88%;max-width:420px;min-height:300px;scroll-snap-align:center;box-sizing:border-box;padding:28px 24px;border-radius:4px;background:url(parchment.jpg) 0 0/180% auto,#e9dcc0;color:var(--ink);box-shadow:inset 0 0 30px rgba(120,86,40,.35),0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:center;text-align:center}
.ypage h3{margin:0 0 10px;font:600 26px var(--f-display);color:#1f150c}.ypage small{font:13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.ypage p{margin:6px 0;font:17px var(--f-book)}
.ybig{font:600 96px/1 var(--f-display)!important;color:#1f150c}
.ytitle{font:600 24px var(--f-display)!important}
.yq{font:italic 18px/1.5 var(--f-book)!important;color:#3b2a1a}
.yfeel{list-style:none;padding:0;margin:0;text-align:left}.yfeel li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dotted var(--ink-line);font:17px var(--f-book)}
.ymonths{display:flex;gap:4px;align-items:flex-end;height:150px}.ymonths>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}.ymonths .mstack i{height:9px;width:80%}.ymonths span{font-size:10px;color:var(--ink-muted)}
.linkdev{display:flex;gap:16px;align-items:center;margin-top:12px;padding:14px;border-radius:10px;background:rgba(0,0,0,.2);flex-wrap:wrap}
.linkdev .qr{flex-shrink:0;width:200px;height:200px;border-radius:6px;overflow:hidden}.linkdev>div:last-child{flex:1;min-width:200px}
.imp{margin-top:10px;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.sortgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
body.compact .sortgrid{grid-template-columns:1fr}
.secrow{display:flex;gap:4px;align-items:center;margin-top:6px}.secrow input{flex:1}.secrow .ghost{width:44px;min-height:44px;padding:0}
.preview{display:flex;gap:18px;align-items:flex-start}
.pvcover{position:relative;width:120px;height:180px;flex-shrink:0;border-radius:1px 4px 4px 1px;overflow:hidden;box-shadow:3px 6px 14px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;text-align:center}
.pvcover b{font:700 13px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:#e3c987;padding:0 12px}
.pvcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvt{min-width:0;flex:1}.pvst{color:var(--gilt);font-size:15px;margin:8px 0}.pvline{font:italic 17px/1.45 var(--f-book);color:var(--text);margin:8px 0}
.welcome p{font:17px/1.55 var(--f-book);color:var(--text);margin:10px 0 0}
body.compact .preview{flex-direction:column;align-items:center;text-align:center}body.compact .pvt .row{justify-content:center}
body.compact .stackm>*{flex:1 1 100%;justify-content:center}

/* ---------- catalogue ---------- */
.dlabel{filter:none!important;opacity:.95!important;font:600 8.5px/1.05 var(--f-ui)!important;white-space:normal;padding:0 1px;box-sizing:border-box}
.dlabel.big{font:600 13px var(--f-ui)!important;opacity:.92!important}
.dcount{position:absolute;text-align:right;font:600 9px var(--f-ui);color:rgba(240,222,180,.75);pointer-events:none;text-shadow:0 1px 1px #000}
.dempty{position:absolute;background:rgba(8,6,4,.5);pointer-events:none;border-radius:2px}
.drawer-hit[disabled]{cursor:default}
.cardhead{display:flex;justify-content:space-between;height:37px;align-items:center;padding:0 2px}
.cpanel{position:absolute;display:flex;flex-direction:column;background:url(parchment.jpg) 0 0/160% auto,#ece2ca;border-radius:3px;box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 0 24px rgba(120,86,40,.3);color:var(--ink);padding:8px 10px;box-sizing:border-box;overflow:hidden}
.cph{font:600 15px var(--f-display);color:#1f150c;padding:0 2px 4px}
.cpanel .cindex{flex:1;min-height:0;display:flex;flex-direction:column}
.cpanel .crows{flex:1;overflow:auto;min-height:0}
.cfind input{box-sizing:border-box;width:100%;min-height:30px;padding:4px 10px;border-radius:6px;border:1px solid var(--ink-line);background:rgba(255,250,235,.45);color:var(--ink);font:16px var(--f-ui);outline:none;-webkit-appearance:none}
.crow{display:flex;gap:8px;align-items:center;width:100%;min-height:34px;padding:0 4px;border:0;border-bottom:1px dotted var(--ink-line);background:none;cursor:pointer;text-align:left;color:var(--ink);font:13px var(--f-book)}
.crow .sw{width:6px;height:20px;border-radius:1px;flex-shrink:0}
.crow .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.on{background:rgba(122,42,31,.12)}
.card-nav{position:absolute;display:flex;align-items:center;gap:10px;justify-content:space-between;z-index:5}
.cardnav{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:420px;margin:14px auto 0}
body:not(.compact) .cardnav{max-width:540px}
.cih{margin:26px 0 8px;font:600 18px var(--f-display);color:var(--gilt)}
.pcat .cindex{background:url(parchment.jpg) 0 0/160% auto,#ece2ca;border-radius:4px;padding:8px 10px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.pcat .crow{min-height:44px;font-size:15px}
.pcat .cfind{margin-bottom:6px}
.pcat{zoom:var(--ts)}

/* ---------- all books ---------- */
.plist{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 92px) max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 30px) max(14px,env(safe-area-inset-left));box-sizing:border-box}
body.compact .plist{padding-top:calc(env(safe-area-inset-top) + 70px);padding-right:34px}
.lpanel{max-width:860px;margin:0 auto;zoom:var(--ts)}
.lsearch{width:100%!important;box-sizing:border-box;display:flex!important}
.lctl{margin-top:10px;overflow-x:auto}.lctl .seg{white-space:nowrap}
.lfil{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.lfil select{min-height:36px;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:14px var(--f-ui);padding:0 12px;-webkit-appearance:none;appearance:none}
.lrows{margin-top:12px;border-radius:6px;overflow:hidden;background:rgba(14,12,10,.55);border:1px solid rgba(212,185,122,.14)}
.lhead{position:sticky;top:-2px;padding:4px 14px;font:600 13px var(--f-display);letter-spacing:.08em;color:var(--gilt);background:rgba(24,19,14,.96);z-index:1}
.lrow{display:flex;gap:12px;align-items:center;width:100%;min-height:58px;padding:7px 14px;border:0;border-bottom:1px solid rgba(212,185,122,.1);background:none;color:var(--text);cursor:pointer;text-align:left;box-sizing:border-box}
.lthumb{position:relative;width:30px;height:44px;flex-shrink:0;border-radius:1px 3px 3px 1px;overflow:hidden;box-shadow:1px 2px 4px rgba(0,0,0,.5)}
.lthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lt{min-width:0;flex:1}.lt b{display:block;font:500 17px/1.2 var(--f-book);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lt small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lr{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:2px}.lr small{font-size:12px;color:var(--muted)}
.lstars{color:var(--gilt);font-size:13px;letter-spacing:1px}
.scrub{position:fixed;right:max(2px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 150px);bottom:calc(env(safe-area-inset-bottom) + 30px);width:30px;display:flex;flex-direction:column;justify-content:center;z-index:45;pointer-events:auto}
.scrub button{flex:1;max-height:26px;border:0;background:none;color:var(--gilt);font:600 11px var(--f-ui);cursor:pointer;padding:0;min-height:16px}
body:not(.compact) .scrub{right:max(10px,env(safe-area-inset-right))}

/* ---------- quote of the day & toasts ---------- */
.qod{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);width:min(520px,calc(100vw - 32px));box-sizing:border-box;z-index:95;padding:18px 22px 16px;border-radius:4px;background:url(parchment.jpg) 0 0/160% auto,#ece2ca;color:var(--ink);box-shadow:inset 0 0 30px rgba(120,86,40,.35),0 20px 40px rgba(0,0,0,.6);cursor:pointer;pointer-events:auto;animation:fade .6s ease-out}
.qod p{margin:0;font:italic 18px/1.5 var(--f-book)}.qod small{display:block;margin-top:8px;font:13px var(--f-ui);color:var(--ink-muted)}
.toast{display:flex;align-items:center;gap:12px;pointer-events:auto}
.toast button{border:0;background:rgba(212,185,122,.18);color:var(--gilt);font:600 14px var(--f-ui);min-height:36px;padding:0 14px;border-radius:18px;cursor:pointer;white-space:nowrap}

/* ---------- phone landscape ---------- */
body.landphone .topbar{min-height:calc(52px + env(safe-area-inset-top));padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px}
body.landphone .wordmark span{display:none}
body.landphone .bottombar{height:calc(52px + env(safe-area-inset-bottom))}
body.landphone .bayname .dots{display:none}
.pscroll,.pcat{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
@media (prefers-reduced-motion:reduce){.drag-ghost,.qod{animation:none!important}}

.deskchip.mini{gap:6px;padding:0 12px;min-height:38px}.deskchip.mini svg{color:var(--gilt);flex-shrink:0}.deskchip.mini b{font:600 14px var(--f-ui)}.deskchip.mini .sep{width:1px;height:16px;background:var(--line);margin:0 2px}
h2[tabindex="-1"]:focus{outline:none}

/* ===================== v3: art direction pass ===================== */
@font-face{font-family:"LibZH";src:local("PingFang TC"),local("PingFangTC-Regular"),local("Noto Sans CJK TC"),local("Noto Sans TC");size-adjust:94%;unicode-range:U+2E80-2FFF,U+3000-303F,U+3040-30FF,U+3100-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF,U+20000-2FA1F}
:root{
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","LibZH","PingFang TC","Noto Sans CJK TC","Noto Sans TC",sans-serif;
  --f-book:"EB Garamond","LibZH","PingFang TC","Noto Sans CJK TC","Noto Sans TC",Georgia,serif;
  --f-display:"Cormorant Garamond","LibZH","PingFang TC","Noto Sans CJK TC","Noto Sans TC",Georgia,serif;
  --f-zhserif:"Songti TC","STSongti-TC-Bold","Noto Serif CJK TC","Noto Serif TC","PingFang TC","Noto Sans CJK TC",serif;
  --ink-wet:#6B4A2A;--gilt-hi:#E9CF8F;--oxblood:#6E1F1A;--inkblue:#23324F;--bottle:#24402F;--oldgold:#8A6A2A;
}
::selection{background:rgba(212,185,122,.35)}
.page textarea,.pb textarea,.writer{caret-color:#7A2A1F}
.page :focus-visible,.pb :focus-visible,.parchment-sheet :focus-visible{outline-color:#7A2A1F}
:lang(zh-Hant){line-height:1.8;letter-spacing:.04em;font-style:normal}

/* ---------- B: spine typography ---------- */
.spine .t{color:#D9BC7A;text-shadow:0 .055em 0 rgba(0,0,0,.7),0 -.04em 0 rgba(255,236,190,.2);-webkit-font-smoothing:antialiased;font-kerning:normal;font-feature-settings:"kern","liga","onum";white-space:nowrap}
.spine .t.v{writing-mode:vertical-rl;text-transform:none;line-height:1.02;letter-spacing:.01em}
.spine .t.v.eb{font-family:"EB Garamond",Georgia,serif;font-weight:600}
.spine .t.v.cg{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700}
.spine .t.v.caps{letter-spacing:.06em}
.spine .t.zh{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--f-zhserif);font-weight:600;letter-spacing:.1em;font-feature-settings:"vert","vrt2";line-height:1.05;text-combine-upright:digits 2}
.spine.light .t{color:#3A2614;text-shadow:0 .04em 0 rgba(255,250,235,.35)}
.spine .t.onlabel{background:none}
.spine.lift::after,.spine.found::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 35%,rgba(255,240,200,.55) 50%,transparent 65%);mix-blend-mode:soft-light;animation:glint .9s cubic-bezier(.4,0,.2,1) both}
@keyframes glint{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.spine{overflow:visible}
.spine.lean{transform-origin:0 100%}
.spine.lean::before{content:"";position:absolute;left:-9px;bottom:0;width:9px;height:60%;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent);pointer-events:none}
.spine .fav{top:3%;left:50%;width:7px;height:7px;margin-left:-3.5px;background:radial-gradient(circle at 40% 35%,#f6e2a6,#c9a45a 55%,#7d5f2a);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);font-size:0}
.spine .sno{font:600 8.5px/1 "EB Garamond",serif;color:#D9BC7A;text-shadow:0 .5px 0 rgba(0,0,0,.7)}
.spine .slip{background:linear-gradient(#efe6d0,#e2d6b8);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.spine .lent{background:#f4f1e8;box-shadow:0 1px 1px rgba(0,0,0,.45);background-image:linear-gradient(transparent 9px,rgba(80,80,80,.35) 9px,rgba(80,80,80,.35) 10px,transparent 10px)}
.spine.tip{transform:translateY(-7px) rotate(-1.2deg)!important;transform-origin:0 100%;box-shadow:0 10px 14px rgba(0,0,0,.55);z-index:7;transition:transform .16s cubic-bezier(.3,0,.2,1),box-shadow .16s}
.shelf .slot{position:absolute;bottom:0;background:rgba(0,0,0,.55);box-shadow:inset 0 0 6px #000;border-radius:2px 2px 0 0;z-index:0;pointer-events:none}
.spine.found{animation:foundPulse 1.6s ease-in-out 2}
@keyframes foundPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,226,170,.75),0 0 18px 4px rgba(255,200,120,.32),0 12px 16px rgba(0,0,0,.6)}50%{box-shadow:0 0 0 1px rgba(255,226,170,.9),0 0 22px 6px rgba(255,200,120,.5),0 12px 16px rgba(0,0,0,.6)}}
.spine.found{transition:transform .4s cubic-bezier(.3,1.3,.5,1)}

/* ---------- E: wall ---------- */
.shelf .genre-tag{bottom:-16px;height:14px;padding:0 7px;font:600 9px/14px var(--f-ui);letter-spacing:.02em;color:#2B1F0E;background:linear-gradient(#DCC287,#A8854A);border-radius:1.5px;box-shadow:0 1px 1px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(60,40,10,.45);text-shadow:0 .5px 0 rgba(255,236,190,.4);overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;z-index:6}
.divider{width:6px;height:68%;margin:0 5px;background:linear-gradient(90deg,#4A3418,#C9A45A 40%,#7D5F2A);border-radius:1px 1px 0 0;box-shadow:1px 0 2px rgba(0,0,0,.6)}
.divider i{display:none}
.plate{color:#2A1C0B;text-shadow:0 1px 0 rgba(255,230,170,.28),0 -1px 0 rgba(0,0,0,.35);font-family:"Cormorant Garamond",serif;font-weight:600}
.wall.zoomed .shelf:not(.z){filter:none}
.zveil{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 50%,rgba(6,4,3,.55),rgba(6,4,3,.7));opacity:0;transition:opacity .55s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:9}
.wall.zoomed .zveil{opacity:1}
.wall.zoomed .shelf.z{z-index:10}
.wall.zoomed .plate{opacity:.92}
.wall.zoomed .atmos{opacity:.4}
.atmos{position:absolute;inset:0;pointer-events:none;z-index:2;transition:opacity .5s}
.cone{position:absolute;width:320px;height:440px;clip-path:polygon(31% 0,69% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(255,214,150,.10),rgba(255,214,150,.03) 60%,transparent 85%);mix-blend-mode:screen;opacity:.6;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.65}}
.halo{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,110,.20),rgba(255,190,110,.08) 35%,transparent 70%);mix-blend-mode:soft-light;animation:flick 3.7s ease-in-out infinite}
.flame{position:absolute;width:6px;height:14px;border-radius:50% 50% 45% 45%;background:radial-gradient(ellipse at 50% 70%,#fff6d8,#ffcf7a 40%,rgba(255,180,90,0) 72%);mix-blend-mode:screen;transform-origin:50% 100%;animation:flick 2.3s ease-in-out infinite,sway 5.9s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.92;transform:scale(1)}23%{opacity:.86;transform:scale(.97)}41%{opacity:1;transform:scale(1.03)}67%{opacity:.9;transform:scale(.99)}83%{opacity:.97;transform:scale(1.02)}}
@keyframes sway{0%,100%{translate:0 0}30%{translate:.4px 0}60%{translate:-.4px 0}}
.dust{position:absolute;pointer-events:none}
.tod{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;z-index:30}
.tod.morning{background:rgba(190,210,235,.08)}.tod.evening{background:rgba(255,180,110,.10)}
.tod.evening~*,.wall .tod{display:block}
.ladder{position:absolute;pointer-events:none;z-index:25;transform-origin:50% 12%;filter:drop-shadow(10px 8px 10px rgba(0,0,0,.45));transition:opacity .4s}
.wall.zoomed~.ladder{opacity:0}
body.baymode .ladder{opacity:.0}
.prop{position:absolute;bottom:0;pointer-events:none;z-index:1}
.prop.stack{width:124px;height:62px}
.prop.stack i{position:absolute;width:20px;height:118px;transform-origin:0 100%;transform:translateY(-20px) rotate(90deg);box-shadow:0 1px 2px rgba(0,0,0,.6);border-radius:1px}
.prop svg{display:block;filter:drop-shadow(2px 2px 2px rgba(0,0,0,.5))}
.prop.bookend{width:10px;height:60px;background:linear-gradient(90deg,#4A3418,#C9A45A 40%,#7D5F2A);border-radius:2px 2px 0 0;box-shadow:2px 0 3px rgba(0,0,0,.6)}
.prop.bookend::after{content:"";position:absolute;left:0;bottom:0;width:26px;height:3px;background:linear-gradient(#C9A45A,#7D5F2A);border-radius:1px}
.oldwall{position:absolute;inset:0;pointer-events:none}
.oldwall .atmos{display:none}

/* bottom bar: a mini map and quiet numerals */
.pager .where{font:15px var(--f-book);color:#C2B8A2;letter-spacing:.06em}
.pager .where small{font-size:13px;color:var(--faint);letter-spacing:.04em}
.case-dot{width:22px;height:30px;padding:3px 2px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(14,10,7,.7);border:1px solid rgba(212,185,122,.18);border-radius:2px;box-sizing:border-box}
.case-dot i{position:static;display:flex;gap:0;height:7px;align-items:flex-end;border-bottom:1px solid rgba(212,185,122,.35);background:none;overflow:hidden}
.case-dot i b{display:block;width:2px;height:6px;margin-right:.4px}
.case-dot.on{outline:1px solid var(--gilt);outline-offset:1px;box-shadow:0 0 8px rgba(212,185,122,.3)}
.bottombar .zoompill{position:static;transform:none;margin:0 auto;background:rgba(20,15,10,.6);border-color:rgba(212,185,122,.3)}
.bottombar.zoomed .pager,.bottombar.zoomed .cases{display:none}
.deskchip{background:rgba(28,20,14,.72);border-color:rgba(212,185,122,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.deskchip:focus:not(:focus-visible){outline:none}
.syncbtn .lbl{text-decoration:none;color:#948B78;font-size:12px}
.dot.green{background:#9DB58A;box-shadow:none}.dot.amber{background:#C9A55E}.dot.red{background:#C27A64}
.wordmark span{display:flex;align-items:center;gap:4px}
body.compact .wordmark span{gap:6px}
body.compact .dot{width:6px;height:6px}
.arrange-banner{background:rgba(24,17,11,.94)}
body:not(.compact) .arrange-banner{top:auto;bottom:calc(104px + env(safe-area-inset-bottom))}
.empty-note{background:url(parchment.jpg) 0 0/160% auto,#ece2ca;color:#2A1E14;border:0;box-shadow:inset 0 0 30px rgba(120,86,40,.35),0 20px 40px rgba(0,0,0,.6)}
.empty-note h2{color:#1F150C!important}.empty-note p{color:#2A1E14!important}

/* search results */
.results{background:rgba(24,17,11,.96);border-radius:12px;border:1px solid rgba(212,185,122,.2);border-top-color:rgba(212,185,122,.35)}
.result .sw{width:9px;height:36px;border-radius:1px;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.result b{font:500 17px var(--f-book)}
.result small{font-size:12.5px;color:#A89C84}
.result em.hit{font-style:normal;color:var(--gilt)}

/* ---------- E: open book ---------- */
.lp-head{flex-shrink:0}
.heart{margin-left:10px}
.btitle{letter-spacing:-.005em;text-wrap:balance}
.kicker{font:600 10.5px/1.3 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#6B5A42;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kicker .ex{display:inline-block;border:1px solid rgba(122,42,31,.4);border-radius:3px;padding:0 5px;margin-left:6px;color:#7A2A1F;font-size:9.5px;line-height:15px}
.cover{gap:10px}
.cover b{font:600 18px/1.15 var(--f-display);text-transform:none;letter-spacing:0;color:#E3C987;padding:0 16px;text-shadow:0 1px 0 rgba(0,0,0,.6),0 -.5px 0 rgba(255,236,190,.2)}
.cover small{white-space:normal;padding:0 14px;letter-spacing:.08em;font:500 10px var(--f-book);font-variant:small-caps;text-transform:lowercase;color:#CDB172;font-size:12px}
.cover .cfl{position:relative;color:#C9A45A;width:72px;opacity:.85}
.cover .cfl svg{display:block;width:72px;height:9px}
.cover.vellum b,.cover.vellum small{color:#4A3420;text-shadow:0 .5px 0 rgba(255,250,235,.35)}.cover.vellum .cfl{color:#7a5a32}
.pb .cover b{font-size:13px;padding:0 10px}.pb .cover small{font-size:10px}.pb .cover .cfl{width:50px}.pb .cover .cfl svg{width:50px}
.bookview::after{content:"";position:absolute;left:575px;top:114px;width:30px;height:642px;background:linear-gradient(90deg,transparent,rgba(60,40,20,.20) 45%,rgba(35,22,10,.38) 50%,rgba(60,40,20,.20) 55%,transparent);pointer-events:none;z-index:1}
.ribbons{gap:10px}
.ribbon{width:72px;height:58px;font:500 15px var(--f-book);color:#F4EAD6;text-shadow:0 1px 1px rgba(0,0,0,.45);background-image:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.10) 32%,rgba(0,0,0,.04) 55%,rgba(0,0,0,.30)),url(silk.jpg)!important;background-size:100% 100%;filter:drop-shadow(0 2px 2px rgba(40,25,10,.35));transform-origin:50% 0;transition:height .38s cubic-bezier(.3,1.3,.5,1)}
.ribbon[aria-selected=true]{height:96px}
.ribbon[data-tab=review]{background-color:var(--oxblood)!important}.ribbon[data-tab=synopsis]{background-color:var(--inkblue)!important}.ribbon[data-tab=quotes]{background-color:var(--bottle)!important}.ribbon[data-tab=notes]{background-color:var(--oldgold)!important}
.pb .ribbons{background:none;justify-content:flex-start;padding:0 12px}
.pb .ribbon{flex:1 1 0;max-width:96px;filter:drop-shadow(0 3px 3px rgba(40,25,10,.4))}
body:not(.compact) .pb .ribbon{flex:0 0 84px}
.pb .ribbon[aria-selected=true]{height:76px!important}
.rating .st{width:28px;height:28px;font-size:0}
.rating .st svg{width:28px;height:28px;display:block}
.rating .st .e path{fill:none;stroke:#93681C;stroke-opacity:.55;stroke-width:1.2}
.rating .st .f path{fill:#9a6f28;stroke:#7a5520;stroke-width:.6}
.rating .st>span{height:28px}
.rating.dark .st .e path{stroke:#D4B97A;stroke-opacity:.5}.rating.dark .st .f path{fill:#d4b97a;stroke:#a8843f}
body:not(.compact) .pb .rating .st,body:not(.compact) .pb .rating .st svg{width:30px;height:30px}
.spill{border:0;border-bottom:1px dotted rgba(122,42,31,.45);border-radius:0;background:none;padding:0 2px;min-height:44px;font:16px var(--f-book);color:#4A2A18}
.fl-rule{color:rgba(122,42,31,.45);text-align:center;margin:14px 0 2px}.fl-rule svg{width:120px;height:14px}
.inkarea{font:18px/1.6 var(--f-book)}
.inkarea::placeholder{color:rgba(138,117,86,.75)}
.inkarea.ruled{background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(60,45,30,.10) 31px 32px);line-height:32px}
.pull{font:500 21px/1.35 var(--f-display);font-style:normal;color:#7A2A1F}
.quote{position:relative;border-left:0;padding-left:18px}
.quote::before{content:"“";position:absolute;left:-2px;top:-8px;font:600 36px/1 var(--f-display);color:rgba(122,42,31,.55)}
.quote textarea{font:normal 19px/1.55 var(--f-book)!important}
.meta dd{font:16px/1.4 var(--f-book)}
.meta dt{font:600 10.5px var(--f-ui);letter-spacing:.06em}
.pg-btn{border:0;background:none;color:#7A2A1F;font:15px var(--f-book);padding:0 4px;gap:6px}
.pg-btn::after{content:"→";font-size:13px}
.chip.add{border-style:dashed}
.booktop{transition:background .25s,box-shadow .25s}
.pscroll~.booktop,.booktop{background:none}
body.compact .booktop,body.portrait .booktop{background:none}
.booktop.scrolled{background:rgba(28,20,14,.86)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(212,185,122,.18)}
.booknav button{font-style:normal}
.booknav i{font-style:normal}
.balt:lang(zh),.bzh{font-style:normal}
.bzh{font-family:var(--f-zhserif);font-weight:600;letter-spacing:.06em;font-feature-settings:"palt"}
.stamp{position:absolute;right:10px;top:-6px;z-index:20;pointer-events:none;filter:drop-shadow(1px 2px 2px rgba(40,10,5,.4))}
#sheet .stamp{right:24px;top:24px}
.inkin{animation:inkIn .7s cubic-bezier(.3,0,.2,1) both,inkDry 1.2s ease-out both;-webkit-mask-image:linear-gradient(90deg,#000 var(--p),transparent calc(var(--p) + 12%));mask-image:linear-gradient(90deg,#000 var(--p),transparent calc(var(--p) + 12%))}
@property --p{syntax:'<percentage>';inherits:false;initial-value:100%}
@keyframes inkIn{from{--p:-12%}to{--p:100%}}
@keyframes inkDry{from{color:var(--ink-wet)}}

/* page turning leaves (iPad) and the flying book */
.leafwrap{position:fixed;inset:0;pointer-events:none;z-index:150}
.leaf{position:absolute;transform-style:preserve-3d;will-change:transform}
.leaf.fromright{transform-origin:0 50%}.leaf.fromleft{transform-origin:100% 50%}
.lf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.lf.back{transform:rotateY(180deg)}
.lfi{position:absolute;left:0;top:0;transform-origin:0 0}
.lback{position:absolute;inset:0;background:linear-gradient(90deg,rgba(60,40,20,.18),transparent 30%)}
.lshade{position:absolute;top:0;bottom:0;right:-70px;width:70px;background:linear-gradient(90deg,transparent,rgba(50,32,15,.22),transparent);opacity:0}
.fromleft .lshade{right:auto;left:-70px}
.flywrap{position:fixed;inset:0;perspective:1400px;pointer-events:none;z-index:160}
.flyouter{position:absolute;transform-origin:0 50%;will-change:transform}
.flyinner{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:0 50%}
.fface{position:absolute;top:0;bottom:0;left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ffront{right:0}.ffront .cover{width:100%!important;height:100%!important;visibility:visible!important;box-shadow:6px 10px 18px rgba(0,0,0,.5)}
.fspine{transform-origin:0 50%;transform:rotateY(90deg);overflow:hidden}
.fspine .spine{position:absolute;left:0;top:0}
.ghostlayer{position:fixed;inset:0;z-index:40;pointer-events:none}
.ghostlayer .stage{position:absolute}
.ghostchrome{position:absolute;inset:0}
.gveil{position:absolute;inset:0;background:#000;opacity:0}

/* ---------- E: catalogue ---------- */
.dlabel{font:400 8.5px/1.05 "Courier Prime",monospace!important;color:#2B2219;mix-blend-mode:multiply;filter:blur(.25px)!important}
.dlabel.big{font:400 12px "Courier Prime",monospace!important;filter:none!important}
.dempty{background:rgba(8,6,4,.55)}
.dfront{position:absolute;z-index:3;transform:translateY(4px) scale(1.03);box-shadow:0 10px 18px rgba(0,0,0,.55);border-radius:2px;pointer-events:none}
.dfront .dlabel{position:absolute}
.card-nav .icon-btn,.cardnav .icon-btn{width:36px;min-width:36px;height:36px;padding:0;border:1px solid #7D5F2A;background:linear-gradient(180deg,#E9CF8F,#C9A45C 48%,#A8823F);color:#2A1C09;box-shadow:inset 0 1px 0 rgba(255,244,214,.6),0 1px 2px rgba(0,0,0,.45)}
.cardcount{font:12px "Courier Prime",monospace!important;color:#C2B8A2!important}
.cph{font:600 17px var(--f-display)}
.cfind input{min-height:32px}
.drawer{background:linear-gradient(180deg,#5E3E25,#43291A 60%,#38220F);box-shadow:inset 0 1px 0 rgba(255,220,170,.16),inset 0 -2px 4px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.45);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.drawer:active{transform:scale(.97)}
.drawer.on{transform:translateY(3px) scale(1.04)}
.drawer .lab{border:1.5px solid #B08A48;background:#EFE6CF;font:400 10px/1.05 "Courier Prime",monospace}
.drawer .pull{width:30px;height:9px;border:0;background:linear-gradient(#E6C983,#8F6D33);border-radius:0 0 15px 15px;box-shadow:inset 0 2px 2px rgba(0,0,0,.45),0 1px 0 rgba(255,230,170,.25)}
.drawer .n{font:9px "Courier Prime",monospace;color:rgba(240,220,180,.6)}
.icard{font:12.5px/19px "Courier Prime",monospace}
body:not(.compact) .icard{font-size:13px;line-height:20px}
.oldcard{pointer-events:none;z-index:4}
.icard,.cardtext{transform-origin:50% 100%}

/* ---------- E: all books ---------- */
.plist~*{}
body[data-view=list] .view .bg{content:url(wall_blur.jpg);filter:none}
.plist{background:rgba(10,7,5,.62)}
.lfil .pick,.lfil select,.lctl .seg button,.sortpill{font:500 14px var(--f-ui)}
.sortpill{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text)}
.sortpill select{position:absolute;inset:0;opacity:0;font-size:16px}
.lhead{background:rgba(30,22,15,.96);font:600 15px var(--f-display);letter-spacing:.04em}
.lt b{font:500 17px/1.2 var(--f-book)}
.svstars{display:inline-flex;gap:1px}
.svstars .sv{width:var(--ss);height:var(--ss)}
.svstars .se{fill:none;stroke:#D4B97A;stroke-opacity:.45;stroke-width:1.4}
.sealdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9a2a22,#5a140f);margin-right:5px;vertical-align:-1px}

/* ---------- E: sheets ---------- */
.sheet{box-shadow:inset 0 0 0 1px rgba(201,164,92,.5),0 30px 60px rgba(0,0,0,.6)}
.sheet h2{font:600 28px/1.1 var(--f-display)}
body.compact .sheet h2{font-size:25px}
.scrim.enter .sheet{animation:riseIn .38s cubic-bezier(.16,1,.3,1),gilt .7s ease-out}
@keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.965)}}
@keyframes gilt{0%{box-shadow:inset 0 0 0 1px rgba(212,185,122,0),0 30px 60px rgba(0,0,0,.6)}40%{box-shadow:inset 0 0 0 1px rgba(212,185,122,.75),0 30px 60px rgba(0,0,0,.6)}}
body.compact .scrim.enter .sheet{animation:riseUp .44s cubic-bezier(.32,.72,0,1)}
@keyframes riseUp{from{transform:translateY(100%)}}
.scrim.enter .parchment-sheet,.scrim.enter .welcome-sheet{animation:unfold .46s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{from{clip-path:inset(48% 0 48% 0 round 4px);transform:scaleY(.96)}to{clip-path:inset(0 round 4px)}}
body.compact .sheet::before{content:"";position:sticky;display:block;top:-12px;margin:-10px auto 6px;width:38px;height:4px;border-radius:2px;background:rgba(212,185,122,.35);z-index:6}
.toc .menu-item{min-height:60px;gap:14px;border-bottom-color:rgba(212,185,122,.10)}
.toc .menu-item>span:last-child{font:500 19px var(--f-book);color:#F3ECDC}
.toc .menu-item small{font:12.5px var(--f-ui);color:#A89C84}
.mi{display:inline-flex;align-items:center;justify-content:center;width:28px;color:var(--gilt);flex-shrink:0}
.primary{border:1px solid #7D5F2A;border-image:none;border-radius:22px;background:linear-gradient(180deg,#E9CF8F 0%,#C9A45C 48%,#A8823F 100%);box-shadow:inset 0 1px 0 rgba(255,244,214,.6),inset 0 -1px 0 rgba(80,55,20,.45),0 1px 2px rgba(0,0,0,.45);color:#2A1C09;font:600 15px var(--f-ui);text-shadow:0 1px 0 rgba(255,240,205,.4);padding:0 18px;height:44px}
.primary:active{filter:brightness(.94);box-shadow:inset 0 2px 3px rgba(80,55,20,.45)}
.primary[disabled]{opacity:1;background:none;border-color:rgba(212,185,122,.3);color:rgba(243,236,220,.4);text-shadow:none;box-shadow:none}
.primary.full{width:100%}
body.compact .topbar .primary.addbtn{width:44px;padding:0}
.ghost,.icon-btn,.seg button,.pick,.menu-item small,.note{font-family:var(--f-ui)}
.pick{font:500 14.5px var(--f-ui)}
body.compact .pick{font-size:15px}
.mwrap{position:relative;display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.18);font:16px var(--f-book);color:var(--text)}
.mwrap .mlab.empty{color:var(--faint);font-family:var(--f-ui);font-size:15px}
.mwrap input{position:absolute!important;inset:0;opacity:.01;width:100%;min-height:0!important;border:0!important;padding:0!important}
.manual-line{display:block;margin-top:6px}
.cpb blockquote{border-left:0;padding-left:18px;position:relative;font:normal 19px/1.55 var(--f-book);color:#2A1E14}
.cpb blockquote::before{content:"“";position:absolute;left:-4px;top:-10px;font:600 36px/1 var(--f-display);color:rgba(122,42,31,.55)}
.cpb cite{font:12px var(--f-ui);color:#6B5A42}
.lede.big i,.ledger i{font-style:normal;color:#E2B38F}
.yq,.pvline{font-style:normal!important}
.pvline::before{content:"“"}.pvline::after{content:"”"}
body:not(.compact) .ypage{flex:0 0 calc(50% - 7px);max-width:none}
.ypages.one{justify-content:center}
.ypage .wseal{margin:0 auto 6px}
.welcome{text-align:center}
.welcome .wseal{display:flex;justify-content:center}
.welcome .exl{margin:4px 0 0!important;font:600 12px var(--f-display)!important;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt)!important}
.welcome h2{margin-top:2px}
.welcome p{font:17px/1.55 var(--f-book);margin:8px 0 0}
.welcome label{text-align:left}
.wlink{display:block;margin:12px auto 0;font-size:15px}
.bindpick{margin-top:14px}
.bindrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bthumb{width:22px;height:64px;padding:0;border:0;border-radius:2px 2px 1px 1px;cursor:pointer;box-shadow:1px 0 1px rgba(0,0,0,.6);outline-offset:2px}
.bthumb.on{outline:2px solid var(--gilt)}
.toast{white-space:nowrap;background:rgba(24,17,11,.95);border:1px solid rgba(212,185,122,.3);border-radius:14px;font:500 14px var(--f-ui);padding:10px 8px 10px 16px}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{background:none;font-weight:600}
.banner{background:rgba(30,21,14,.95);border-color:rgba(212,185,122,.35)}
.banner::before{content:"";width:7px;height:7px;border-radius:50%;background:#C9A55E;flex-shrink:0}

/* letters, seals, motes */
.letter{position:fixed;right:max(16px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 74px);z-index:96;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:0;border-radius:6px;background:rgba(24,17,11,.92);color:var(--text);font:500 13px var(--f-ui);box-shadow:0 10px 24px rgba(0,0,0,.5);cursor:pointer;pointer-events:auto;max-width:min(360px,calc(100vw - 32px));text-align:left}
.letter .lfold svg{display:block;width:58px;height:36px}

  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const b64e = (s) => { const bytes = typeof s === 'string' ? new TextEncoder().encode(s) : s; let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };

const META_KEYS = new Set(['id', '_t', 'updatedAt', 'createdAt']);
const QUIET_KEYS = new Set(['pos', 'enriched', 'coverUrl', 'pages', 'isbn', 'publisher', 'subjects', 'sample', 'binding']);

const Store = {
  data: LS.get('library.data', null),
  sha: LS.get('library.sha', null),
  gh: LS.get('library.github', { repo: 'wilsontsh/the-library-data', token: '' }),
  timer: null, lsTimer: null, pushing: false, again: false,
  status: 'local', savedAt: null, error: '',
  ensure() {
    if (!this.data) this.data = { books: {}, settings: {}, deleted: {} };
    this.data.books = this.data.books || {}; this.data.deleted = this.data.deleted || {}; this.data.settings = this.data.settings || {};
    for (const [id, b] of Object.entries(this.data.books)) b.id = id;
  },
  /* write a patch into a book, stamping each field so two devices merge field by field */
  patch(id, p) {
    this.ensure();
    const now = Date.now();
    const b = this.data.books[id] || (this.data.books[id] = { id, createdAt: now });
    b._t = b._t || {};
    for (const [k, v] of Object.entries(p)) { if (META_KEYS.has(k)) continue; b[k] = v; b._t[k] = now; }
    b.updatedAt = now; delete this.data.deleted[id];
    this.touch();
    return b;
  },
  setBook(id, doc) { // a whole new book
    this.ensure();
    const now = Date.now();
    const b = Object.assign({}, doc, { id, createdAt: doc.createdAt || now, updatedAt: now, _t: {} });
    for (const k of Object.keys(doc)) if (!META_KEYS.has(k)) b._t[k] = now;
    this.data.books[id] = b; delete this.data.deleted[id];
    this.touch();
    return b;
  },
  putRaw(id, doc) { this.ensure(); this.data.books[id] = Object.assign({}, doc, { id }); delete this.data.deleted[id]; },
  del(id) { this.ensure(); delete this.data.books[id]; this.data.deleted[id] = Date.now(); this.touch(); },
  settings(p) { this.ensure(); const s = this.data.settings; s._t = s._t || {}; const now = Date.now(); for (const [k, v] of Object.entries(p)) { s[k] = v; s._t[k] = now; } s.updatedAt = now; this.touch(); },
  touch() {
    this.status = this.connected() ? 'pending' : 'local'; renderSync();
    clearTimeout(this.lsTimer); this.lsTimer = setTimeout(() => this.saveLocal(), 250);
    clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500);
  },
  saveLocal() {
    clearTimeout(this.lsTimer); this.lsTimer = null;
    const ok = LS.set('library.data', this.data);
    if (ok !== !S.storageError) return ok;
    S.storageError = !ok; renderBanner();
    return ok;
  },
  flush() { // the app is going to the background: write everything now
    if (this.lsTimer) this.saveLocal();
    if (this.timer && this.connected()) { clearTimeout(this.timer); this.timer = null; this.push(false, true); }
  },
  connected() { return !!(this.gh.token && this.gh.repo); },
  async api(method, body, raw, path, keepalive) {
    const headers = { Authorization: 'Bearer ' + this.gh.token, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (body) headers['Content-Type'] = 'application/json';
    return fetch(`https://api.github.com/repos/${this.gh.repo}/contents/${path || 'library.json'}`, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store', keepalive: !!keepalive });
  },
  mergeDoc(a, b) { // field-by-field, newest stamp wins
    const ta = a._t || {}, tb = b._t || {};
    const out = Object.assign({}, a, b); const t = {};
    const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
    for (const k of keys) {
      if (META_KEYS.has(k)) continue;
      const sa = ta[k] ?? a.updatedAt ?? a.createdAt ?? 0, sb = tb[k] ?? b.updatedAt ?? b.createdAt ?? 0;
      if (!(k in b)) { out[k] = a[k]; t[k] = sa; } else if (!(k in a)) { out[k] = b[k]; t[k] = sb; } else if (sa >= sb) { out[k] = a[k]; t[k] = sa; } else { out[k] = b[k]; t[k] = sb; }
    }
    out._t = t; out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0); out.createdAt = Math.min(a.createdAt || Infinity, b.createdAt || Infinity); if (!isFinite(out.createdAt)) out.createdAt = Date.now();
    return out;
  },
  merge(local, remote) {
    const out = { books: {}, settings: {}, deleted: Object.assign({}, remote.deleted || {}, local.deleted || {}) };
    for (const [id, t] of Object.entries(remote.deleted || {})) out.deleted[id] = Math.max(t, (local.deleted || {})[id] || 0);
    const ids = new Set([...Object.keys(local.books || {}), ...Object.keys(remote.books || {})]);
    for (const id of ids) {
      const a = (local.books || {})[id], b = (remote.books || {})[id];
      const pick = !a ? b : !b ? a : this.mergeDoc(a, b);
      const delAt = out.deleted[id];
      if (pick && !(delAt && delAt >= (pick.updatedAt || pick.createdAt || 0))) { out.books[id] = pick; pick.id = id; delete out.deleted[id]; }
    }
    out.settings = this.mergeDoc(local.settings || {}, remote.settings || {});
    return out;
  },
  async pull() {
    if (!this.connected()) return false;
    this.status = 'syncing'; renderSync();
    try {
      const r = await this.api('GET');
      if (r.status === 404) { this.sha = null; this.ensure(); await this.push(true); return true; }
      if (r.status === 401 || r.status === 403) throw new Error('auth');
      if (!r.ok) throw new Error('http ' + r.status);
      const meta = await r.json();
      let text = meta.content ? b64d(meta.content) : null;
      if (!text) { const rr = await this.api('GET', null, true); text = await rr.text(); }
      const remote = JSON.parse(text || '{}');
      this.sha = meta.sha; LS.set('library.sha', this.sha);
      this.ensure();
      const before = this.data.books || {};
      const merged = this.merge(this.data, remote);
      const fresh = Object.values(merged.books).filter((b) => !before[b.id] || (b.updatedAt || 0) > (before[b.id].updatedAt || 0)).length;
      if (fresh && this.savedAt && typeof letter === 'function') letter('A letter from your other device', `${plural(fresh, 'book')} updated since you were last here.`);
      const changed = JSON.stringify(merged.books) !== JSON.stringify(remote.books || {}) || JSON.stringify(merged.settings) !== JSON.stringify(remote.settings || {});
      this.data = merged; this.saveLocal();
      this.status = 'synced'; this.error = ''; this.savedAt = Date.now();
